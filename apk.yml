# Costruisce l'APK Android di Rotta Nautica a ogni modifica su main (o a mano da Actions → Build APK → Run workflow).
# L'APK contiene tutti i file dell'app e la libreria della carta: si installa e si apre senza passare dal sito.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepara i file dell'app
        run: |
          mkdir -p build/www/leaflet
          cd build
          npm init -y > /dev/null
          npm install --no-audit --no-fund leaflet@1.9.4 @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cp ../index.html ../app.js ../water.js ../channels.js ../enc.js ../seamarks.js ../sw.js ../manifest.webmanifest ../icon-192.png ../icon-512.png www/
          cp -r node_modules/leaflet/dist/* www/leaflet/
          # la libreria della carta viene inclusa nell'APK invece di scaricarla da Internet
          sed -i 's#https://unpkg.com/leaflet@1.9.4/dist/#leaflet/#g' www/index.html

      - name: Crea il progetto Android
        working-directory: build
        run: |
          npx cap init "Rotta Nautica" it.capofusnez.rottanautica --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Permessi, versione e icona
        working-directory: build/android
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" app/build.gradle
          sudo apt-get install -y -qq imagemagick > /dev/null
          rm -rf app/src/main/res/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=app/src/main/res/mipmap-${d%%:*}; size=${d##*:}
            mkdir -p "$dir"
            convert ../../icon-512.png -resize ${size}x${size} "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_foreground.png"
          done

      - name: Compila l'APK
        working-directory: build/android
        run: |
          # l'SDK Android è già installato sui server di GitHub
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          # chiave di firma fissa, imposta esplicitamente a Gradle: ogni nuova versione si installa sopra la precedente
          KS="$GITHUB_WORKSPACE/android-debug.keystore"
          test -f "$KS" || { echo "Manca android-debug.keystore nella radice del repository"; exit 1; }
          cat >> app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  rottaFissa {
                      storeFile file("$KS")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.rottaFissa }
              }
          }
          GRADLE
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../rotta-nautica.apk
          # stampa l'impronta della firma: deve essere sempre la stessa a ogni costruzione
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs ../../rotta-nautica.apk | grep -i "SHA-256"

      - name: Pubblica l'APK
        uses: actions/upload-artifact@v4
        with:
          name: rotta-nautica-apk
          path: rotta-nautica.apk
