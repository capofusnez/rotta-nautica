# Aggiorna i dati nautici di tutta Italia (canali, briccole, mede, boe, fari, lagune) a riquadri di 1°,
# e – la prima volta o su richiesta – le profondità EMODnet. Si avvia a mano
# (Actions → Aggiorna dati nautici → Run workflow) e da solo il primo giorno di ogni mese.
name: Aggiorna dati nautici

on:
  workflow_dispatch:
    inputs:
      profondita:
        description: "Scarica di nuovo anche le profondità EMODnet"
        type: boolean
        default: false
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: write

concurrency:
  group: dati-nautici
  cancel-in-progress: false

jobs:
  dati:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dati nautici di tutta Italia (OpenStreetMap / OpenSeaMap)
        run: |
          npm install --no-save --no-audit --no-fund osmtogeojson
          node tools/build_nautica.mjs

      - name: Python
        if: ${{ github.event.inputs.profondita == 'true' || hashFiles('depth/index.json') == '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Profondità EMODnet
        if: ${{ github.event.inputs.profondita == 'true' || hashFiles('depth/index.json') == '' }}
        run: |
          pip install --quiet rasterio numpy pillow
          python tools/build_depth.py

      - name: Riepilogo
        run: |
          du -sh nautica depth 2>/dev/null || true
          ls nautica | wc -l

      - name: Salva nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A nautica depth 2>/dev/null || git add -A nautica
          if git diff --cached --quiet; then echo "Dati invariati"; exit 0; fi
          git commit -m "Aggiorna dati nautici (OpenStreetMap) e profondità (EMODnet)"
          git push
